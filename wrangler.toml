name = "kitora-command-center"
main = "worker.ts"
compatibility_date = "2026-09-23"
workers_dev = true

[vars]
# Set secrets with: npx wrangler secret put KCC_WORKER_SECRET
# Set provider keys only when a real provider account is configured.

[[d1_databases]]
binding = "KCC_DB"
database_name = "kitora-command-center"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
