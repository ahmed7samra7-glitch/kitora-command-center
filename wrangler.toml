name = "kitora-command-center"
main = "worker.ts"
compatibility_date = "2026-09-22"
workers_dev = true
previews = { }

[vars]
KCC_AI_PROVIDER = "gemini"
GEMINI_MODEL = "gemini-3.5-flash-lite"
KCC_ALLOW_PAID_AI_FALLBACK = "false"
KCC_AUTOFULFILL_ENABLED = "true"
KCC_MAX_AUTO_FULFILL_COST_USD = "30"

# Secrets are intentionally not declared as deployment-required.
# The runtime remains fail-closed when they are absent:
# - worker-authenticated task endpoints return 401
# - Brain execution blocks without a live provider
# - /api/kcc/health stays 503 until provider-backed evidence exists
# Add KCC_WORKER_SECRET and GEMINI_API_KEY in Cloudflare before enabling autonomous Brain execution.

[[d1_databases]]
binding = "KCC_DB"
database_name = "kitora-command-center"
database_id = "74190e7b-5ff0-4d91-bfcb-b0e51d081e15"
migrations_dir = "migrations"

[[queues.producers]]
binding = "KCC_TASK_QUEUE"
queue = "kitora-command-center-tasks"

[[queues.consumers]]
queue = "kitora-command-center-tasks"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 1
dead_letter_queue = "kitora-command-center-tasks-dlq"

[triggers]
crons = [
  "*/15 * * * *",
  "0 * * * *",
  "0 */6 * * *",
  "10 */6 * * *",
  "0 0 * * *"
]
