name: Apply KCC P0 Launch Hardening

on:
  workflow_dispatch:
  push:
    branches: [kcc/launch-p0-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: kcc-p0-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply P0 patch v2
        run: node scripts/applyLaunchP0HardeningV2.mjs

      - name: Type-check
        run: npm install && npm run lint

      - name: Production build
        run: npm run build

      - name: Run P0 smoke tests
        run: npx tsx scripts/runP0SmokeTests.ts

      - name: Verify launch guards
        run: |
          grep -q "requireExecutionSecret" server.ts
          grep -q "app.post('/api/kcc/loop/tick'" server.ts
          grep -q "app.post('/api/kcc/agent/process-queue'" server.ts
          grep -q "STORAGE_DRIVER=\"local\"" .env.example
          grep -q "STORAGE_DRIVER === 'local'" server/dbStorage.ts
          ! grep -q "path.startsWith('/api/phase4/store/order')" server.ts
          grep -q "ENABLE_CONTINUOUS_LOOP" server/kccMissionLoop.ts
          grep -q "ENABLE_CONTINUOUS_LOOP" server/autonomousAgentRuntime.ts
          grep -q "ENABLE_CONTINUOUS_LOOP" server/scheduler.ts
          grep -q "verifyWebhookSignature" server/paypal.ts
          grep -q "paypalWebhookEvents" server/paypal.ts
          test -f server/durableTaskQueue.ts
          grep -q "kcc_claim_task_batch" supabase/migrations/002_kcc_task_queue.sql
          grep -q "STORAGE_DRIVER.*supabase" server/durableTaskQueue.ts

      - name: Commit hardened source
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "KCC Release Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts server/dbStorage.ts server/kccMissionLoop.ts server/autonomousAgentRuntime.ts server/scheduler.ts server/paypal.ts server/durableTaskQueue.ts .env.example scripts/applyLaunchP0HardeningV2.mjs scripts/runP0SmokeTests.ts supabase/migrations/001_kcc_runtime_state.sql supabase/migrations/002_kcc_task_queue.sql server/storageAdapter.ts server/supabaseStorage.ts docs/STORAGE_PRODUCTION.md .github/workflows/apply-p0-hardening.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: harden KCC P0 runtime and execution boundaries"
          git push origin HEAD:kcc/launch-p0-hardening
