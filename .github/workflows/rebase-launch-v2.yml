name: Rebuild KCC Launch Branch

on:
  push:
    branches: [kcc/launch-v2]

permissions:
  contents: write

concurrency:
  group: kcc-launch-v2
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.event.head_commit.message != 'ci: apply launch hardening onto current main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Overlay hardened source from legacy launch branch
        run: |
          set -euo pipefail
          git fetch origin kcc/launch-p0-hardening
          git checkout origin/kcc/launch-p0-hardening -- \
            server.ts \
            server/autonomousAgentRuntime.ts \
            server/dbStorage.ts \
            server/durableTaskQueue.ts \
            server/kccMissionLoop.ts \
            server/paypal.ts \
            server/scheduler.ts \
            server/storageAdapter.ts \
            server/supabaseStorage.ts \
            supabase/migrations/001_kcc_runtime_state.sql \
            supabase/migrations/002_kcc_task_queue.sql \
            scripts/applyLaunchP0HardeningV2.mjs \
            scripts/runP0SmokeTests.ts \
            docs/STORAGE_PRODUCTION.md

      - name: Verify source
        run: |
          npm install
          npm run lint
          npm run build

      - name: Commit rebuilt launch branch
        run: |
          git config user.name "KCC Release Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: apply launch hardening onto current main"
          git push origin HEAD:kcc/launch-v2
