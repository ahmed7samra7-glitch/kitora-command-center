name: Rebuild KCC Launch Branch

on:
  push:
    branches: [kcc/launch-v2]

permissions:
  contents: write

concurrency:
  group: kcc-launch-v2
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.event.head_commit.message != 'ci: apply launch hardening onto current main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply launch diff from legacy branch
        run: |
          set -euo pipefail
          git fetch origin main kcc/launch-p0-hardening
          git diff 94081a0b6c526b2974f2169315acb4aa322b8692..origin/kcc/launch-p0-hardening > /tmp/kcc-launch.patch
          git apply --3way --index /tmp/kcc-launch.patch

      - name: Verify source
        run: |
          npm install
          npm run lint
          npm run build

      - name: Commit rebuilt launch branch
        run: |
          git config user.name "KCC Release Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: apply launch hardening onto current main"
          git push origin HEAD:kcc/launch-v2
