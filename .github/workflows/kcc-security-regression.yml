name: KCC Security Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  security-regression:
    name: Security Regression Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Reject embedded credential fallbacks
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE "DEFAULT_PASSWORD|KCC_SINGLE_OWNER_JWT_SECRET|process\.env\.ADMIN_PASSWORD[[:space:]]*&&|x-worker-id.*bypass|worker.*bypass" server --include='*.ts' --include='*.js'; then
            echo "Security regression detected: embedded/default credential or worker-auth bypass found."
            exit 1
          fi
      - name: Type check
        run: bun run lint
