name: KCC Brain Scale-to-Zero Verification

on:
  push:
    branches: [kcc/launch-v2]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply Brain scale-to-zero patch in workspace
        run: node scripts/applyBrainScaleZero.mjs

      - name: Type-check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Verify Brain/worker separation
        run: |
          grep -q "Brain OS remains persistent through durable state" server.ts
          grep -q "ENABLE_CONTINUOUS_LOOP" server.ts
          grep -q "executeMissionTick" server/kccMissionLoop.ts
          grep -q "processQueueBatch" server/autonomousAgentRuntime.ts
          echo "KCC Brain OS boundary verified."

      - name: Persist verified source changes
        if: github.event_name == 'push'
        run: |
          git config user.name "KCC Release Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts server/kccMissionLoop.ts server/autonomousAgentRuntime.ts scripts/applyBrainScaleZero.mjs .github/workflows/brain-scale-zero-ci.yml
          if git diff --cached --quiet; then
            echo "No generated source changes to persist."
            exit 0
          fi
          git commit -m "feat: separate persistent KCC Brain from ephemeral workers"
          git push origin HEAD:kcc/launch-v2
