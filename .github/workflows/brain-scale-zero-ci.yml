name: KCC Brain Scale-to-Zero Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply Brain scale-to-zero patch in workspace
        run: node scripts/applyBrainScaleZero.mjs

      - name: Validate patch did not mutate unrelated files
        shell: bash
        run: |
          set -euo pipefail
          allowed=$'server.ts\nserver/kccMissionLoop.ts\nserver/autonomousAgentRuntime.ts'
          git diff --check
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "\n${allowed}\n" in
              *"\n${file}\n"*) ;;
              *) echo "Unexpected workspace mutation: ${file}" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)

      - name: Type-check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Verify Brain/worker separation
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Brain OS remains persistent through durable state" server.ts
          grep -q "ENABLE_CONTINUOUS_LOOP" server.ts
          grep -q "Continuous daemon disabled" server/kccMissionLoop.ts
          grep -q "processQueueBatch" server/autonomousAgentRuntime.ts
          echo "KCC Brain OS boundary verified."
