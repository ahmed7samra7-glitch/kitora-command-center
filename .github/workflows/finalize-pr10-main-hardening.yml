name: Finalize PR10 main hardening
on:
  push:
    branches: [feat/kcc-real-provider-boundary]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply configured health port and verify
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text()
          old = "server: { status: 'UP', port: 3000, host: '0.0.0.0' }"
          new = "server: { status: 'UP', port: PORT, host: '0.0.0.0' }"
          if old not in s:
              raise SystemExit('expected hard-coded health port not found')
          p.write_text(s.replace(old, new, 1))
          PY
          npm test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git commit -m 'fix: report configured health port'
          git rm -f .github/workflows/finalize-pr10-main-hardening.yml
          git commit -m 'chore: remove temporary PR10 finalization workflow'
          git push origin HEAD:feat/kcc-real-provider-boundary
