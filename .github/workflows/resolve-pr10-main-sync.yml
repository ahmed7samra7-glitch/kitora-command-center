name: Resolve PR10 Main Sync

on:
  push:
    branches:
      - feat/kcc-real-provider-boundary

permissions:
  contents: write

jobs:
  sync-main:
    if: github.ref == 'refs/heads/feat/kcc-real-provider-boundary'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: feat/kcc-real-provider-boundary
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch main
        run: git fetch origin main

      - name: Merge main and resolve only known server conflict
        shell: bash
        run: |
          set -euo pipefail
          if git merge --no-edit origin/main; then
            echo "Main merged without conflicts."
          else
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Conflicted files: ${conflicts}"
            if [[ "${conflicts}" != "server.ts" ]]; then
              echo "Unexpected conflict set; refusing automatic resolution."
              exit 1
            fi
            git checkout --ours -- server.ts
            python - <<'PY'
            from pathlib import Path
            p = Path('server.ts')
            s = p.read_text()
            old = "server: { status: 'UP', port: 3000, host: '0.0.0.0' }"
            new = "server: { status: 'UP', port: PORT, host: '0.0.0.0' }"
            if old not in s:
                raise SystemExit('Expected PR10 health-port text was not found; refusing unsafe resolution.')
            p.write_text(s.replace(old, new, 1))
            PY
            git add server.ts
            git commit -m "chore: sync PR #10 with main"
          fi

      - name: Remove temporary resolver
        run: |
          git rm -f .github/workflows/resolve-pr10-main-sync.yml
          git commit -m "chore: remove temporary PR sync workflow"

      - name: Push resolved PR branch
        run: git push origin HEAD:feat/kcc-real-provider-boundary
