name: KCC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kcc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, type-check, and production-boundary verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify real CJ provider boundary
        run: npm run verify:real-provider-boundary

      - name: Verify real notification provider boundary
        run: npm run verify:real-notification-boundary

      - name: Verify WhatsApp delivery evidence boundary
        run: npm run verify:whatsapp-delivery-evidence

      - name: Verify production-readiness truthfulness
        run: npm run verify:production-readiness-truth

      - name: Verify production server entrypoint and webhook runtime
        run: npm run verify:server-entry-runtime

      - name: Verify security startup and authentication fail-closed behavior
        run: npm run verify:security-fail-closed

      - name: Verify reality evidence boundary
        run: npm run verify:reality-evidence-boundary

      - name: Verify PayPal fail-closed capture semantics
        run: npm run verify:paypal-fail-closed

      - name: Verify PayPal capture response evidence
        run: npm run verify:paypal-capture-evidence

      - name: Verify Cloudflare Worker runtime
        run: npm run verify:cloudflare-runtime

      - name: Verify autonomous production commerce guard
        run: npm run verify:production-commerce-guard
