name: Merge main into PR10
on:
  push:
    branches: [feat/kcc-real-provider-boundary]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge main and resolve PR10 integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="server.ts
server/productionReadinessAudit.ts"
            test "$conflicts" = "$expected"
            git checkout --ours -- server.ts
            git checkout --theirs -- server/productionReadinessAudit.ts
            python - <<'PY'
            from pathlib import Path
            p = Path('server.ts')
            s = p.read_text()
            old = "server: { status: 'UP', port: 3000, host: '0.0.0.0' }"
            new = "server: { status: 'UP', port: PORT, host: '0.0.0.0' }"
            if old in s:
                s = s.replace(old, new, 1)
            p.write_text(s)
            PY
            git add server.ts server/productionReadinessAudit.ts
            git commit -m 'chore: reconcile PR10 with latest main'
          else
            git commit --allow-empty -m 'chore: reconcile PR10 with latest main'
          fi
          git rm -f .github/workflows/merge-main-into-pr10.yml
          git commit -m 'chore: remove temporary PR10 merge workflow'
          git push origin HEAD:feat/kcc-real-provider-boundary
